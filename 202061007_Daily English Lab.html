<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily English Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --sheet:#FFFFFF; --ink:#15202B; --muted:#5A6774; --line:#D5DBE1; --soft:#F6F8FA;
  --marker:#FFE36E; --markInk:#15202B;
  --l1:#2E8B57; --l2:#2F6DB5; --l3:#7A4CC2;
  --ok:#2E8B57; --bad:#C2453A; --warn:#B7791F;
  --focus:#2F6DB5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171E; --sheet:#19212A; --ink:#E5EAF0; --muted:#94A2B0; --line:#2B3641; --soft:#1F2832;
    --marker:rgba(255,214,0,.32); --markInk:#FFF6CC;
    --l1:#5CC08A; --l2:#6AA4EA; --l3:#B08CF0; --ok:#5CC08A; --bad:#EE7D72; --warn:#E3B04B; --focus:#6AA4EA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11171E; --sheet:#19212A; --ink:#E5EAF0; --muted:#94A2B0; --line:#2B3641; --soft:#1F2832;
  --marker:rgba(255,214,0,.32); --markInk:#FFF6CC;
  --l1:#5CC08A; --l2:#6AA4EA; --l3:#B08CF0; --ok:#5CC08A; --bad:#EE7D72; --warn:#E3B04B; --focus:#6AA4EA;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 140px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
mark{background:linear-gradient(transparent 38%,var(--marker) 38%,var(--marker) 92%,transparent 92%);color:var(--markInk);padding:0 .08em}
.zh{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:0 auto;padding:12px 18px 0;display:flex;flex-wrap:wrap;align-items:end;gap:6px 18px}
.brand{font-weight:700;font-size:1.25rem;letter-spacing:-.01em;margin:0 auto 8px 0}
.brand small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.stats{display:flex;gap:14px;font-size:.85rem;color:var(--muted);margin-bottom:10px}
.stats b{color:var(--ink);font-size:1.05rem}
nav.tabs{flex-basis:100%;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

main{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
.view[hidden]{display:none}
h2{font-size:1.5rem;margin:0 0 2px;letter-spacing:-.01em}
h3{font-size:1rem;margin:28px 0 10px}
.sub{color:var(--muted);margin:0 0 6px}
.core{border-left:4px solid var(--ink);padding:6px 12px;margin:12px 0 4px;background:var(--sheet)}

/* library */
.lib{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start}
.side{position:sticky;top:145px;max-height:calc(100vh - 160px);overflow:auto;padding-right:4px}
.side .set{margin-bottom:14px}
.side .setbtn{display:block;width:100%;text-align:left;border:0;background:none;font-weight:700;padding:4px 6px;cursor:pointer;border-radius:4px}
.side .setbtn small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.side .gbtn{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:5px 8px 5px 14px;cursor:pointer;border-radius:4px;color:var(--ink);font-size:.95rem}
.side .gbtn span:last-child{color:var(--muted);font-size:.8rem}
.side .gbtn[aria-current="true"],.side .setbtn[aria-current="true"]{background:var(--sheet);box-shadow:inset 3px 0 0 var(--ink)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:22px 24px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-weight:600;font-size:.85rem;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.en{font-weight:600;white-space:nowrap}
tr.item{cursor:pointer}
tr.item:hover td{background:var(--soft)}
tr.exrow td{background:var(--soft);padding:8px 14px 12px}
.fit{display:inline-block;font-size:.75rem;padding:1px 7px;border-radius:10px;border:1px solid;white-space:nowrap}
.fit.w{color:var(--ok)} .fit.c{color:var(--muted)} .fit.x{color:var(--bad)}
.cmp td:first-child,.cmp td:nth-child(2){font-weight:600;white-space:nowrap}
.cmp td:nth-child(2){color:var(--muted)}
.vs{color:var(--muted);font-weight:400;padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:14px;padding:2px 10px;font-size:.88rem;background:var(--sheet)}

/* ladder */
.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}
.step{border:1px solid var(--line);border-top:5px solid var(--lc);border-radius:4px;padding:10px 12px;background:var(--sheet)}
.step:nth-child(1){--lc:var(--l1)} .step:nth-child(2){--lc:var(--l2);margin-top:22px} .step:nth-child(3){--lc:var(--l3);margin-top:44px}
.ladder{align-items:start}
.step h4{margin:0 0 6px;font-size:.9rem;color:var(--lc)}
.sent{padding:8px 0;border-top:1px dashed var(--line)}
.sent:first-of-type{border-top:0}
.sent .line{display:flex;gap:8px;align-items:flex-start}
.sent .tx{flex:1}
.sent .tr{color:var(--muted);font-size:.88rem;margin-top:2px}
.hidezh .tr{display:none}
.ctx{font-size:.7rem;border-radius:3px;padding:1px 5px;margin-right:6px;vertical-align:2px;background:var(--soft);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.ctx.S{color:var(--l2)} .ctx.M{color:var(--l3)}
.lvb{font-size:.7rem;border-radius:3px;padding:1px 6px;margin-right:6px;vertical-align:2px;color:#fff;white-space:nowrap}
.lvb.l1{background:var(--l1)} .lvb.l2{background:var(--l2)} .lvb.l3{background:var(--l3)}
.ttsw{display:inline-flex;align-items:center;gap:4px}
.ttsw button{border:1px solid var(--line);background:var(--sheet);color:var(--muted);font-size:.78rem;padding:2px 8px;cursor:pointer}
.ttsw button:first-of-type{border-radius:4px 0 0 4px} .ttsw button:last-of-type{border-radius:0 4px 4px 0;margin-left:-1px}
.ttsw button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:20;background:var(--sheet);border:1px solid var(--ink);border-radius:6px;padding:10px 14px;max-width:92vw;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.9rem;box-shadow:0 4px 16px rgba(0,0,0,.18)}
#toast[hidden]{display:none}
#toast .btn{padding:5px 10px;font-size:.85rem}
.say{border:1px solid var(--line);background:var(--sheet);border-radius:50%;width:28px;height:28px;flex:none;cursor:pointer;font-size:.7rem;line-height:1;color:var(--muted)}
.say:hover{color:var(--ink);border-color:var(--ink)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:.9rem;color:var(--muted);cursor:pointer}
.lvkey{display:inline-flex;gap:10px;font-size:.8rem;color:var(--muted)}
.lvkey i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* visuals */
.zoom{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.zoomcol h4{margin:0 0 8px;font-size:.85rem;color:var(--muted)}
.nest{border:2px solid var(--ink);border-radius:6px;padding:8px 10px 10px}
.nest .nest{margin-top:6px;border-width:1.5px}
.nest b{font-size:.95rem}
.nest .k{font-size:.78rem;color:var(--muted);margin-left:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ink);margin-right:6px;vertical-align:0}
.timeline svg{width:100%;height:auto;display:block}

/* buttons */
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--sheet);padding:9px 16px;border-radius:4px;cursor:pointer;font-weight:600}
.btn.ghost{background:var(--sheet);color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* today */
.today{max-width:680px;margin:0 auto}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
.meter div{height:100%;background:var(--ink);transition:width .25s}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:28px 26px;min-height:300px;display:flex;flex-direction:column}
.card .from{font-size:.8rem;color:var(--muted);margin-bottom:14px}
.card .q{font-size:1.45rem;font-weight:600;line-height:1.35}
.card .q small{display:block;font-size:.95rem;font-weight:400;color:var(--muted);margin-top:6px}
.card .a{margin-top:20px;padding-top:16px;border-top:2px solid var(--ink)}
.card .a .big{font-size:1.4rem;font-weight:700}
.card .actions{margin-top:auto;padding-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.card .actions .btn{flex:1;min-width:130px}
.btn.weak{background:var(--sheet);color:var(--bad);border-color:var(--bad)}
.btn.good{background:var(--ok);border-color:var(--ok);color:#fff}
.done{text-align:center;padding:40px 10px}
.done .n{font-size:3rem;font-weight:700}

/* quiz */
.qsets{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px}
.qsets button{border:1px solid var(--line);background:var(--sheet);border-radius:4px;padding:8px 12px;cursor:pointer}
.qsets button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.opts button{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:14px;cursor:pointer;font-size:1.05rem;font-weight:600;text-align:left}
.opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--sheet))}
.opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--sheet))}
.fb{margin-top:16px;padding:12px 14px;border-radius:4px;background:var(--soft)}
.fb b.ok{color:var(--ok)} .fb b.no{color:var(--bad)}

/* add */
.add{max-width:820px}
textarea{width:100%;min-height:140px;padding:12px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);resize:vertical}
.drop{border:1.5px dashed var(--line);border-radius:4px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;background:var(--sheet)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{height:70px;border-radius:3px;border:1px solid var(--line)}
.status{font-size:.9rem;color:var(--muted);min-height:1.4em;margin:10px 0}
.note{font-size:.88rem;color:var(--muted);background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.mylist li{margin:6px 0}
.linkbtn{border:0;background:none;color:var(--bad);cursor:pointer;text-decoration:underline;font-size:.85rem}

@media (max-width:860px){
  .lib{grid-template-columns:1fr}
  .side{position:static;max-height:none;display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
  .side .set{flex:none;min-width:190px;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:8px}
  .ladder{grid-template-columns:1fr}
  .step:nth-child(n){margin-top:0}
  .zoom{grid-template-columns:1fr}
  .sheet{padding:16px}
  .opts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <p class="brand">Daily English Lab<small class="zh">Server 機構工程師的每日英文練習</small></p>
    <div class="stats zh" aria-live="polite">
      <span>連續 <b id="stStreak">0</b> 天</span>
      <span>今天 <b id="stToday">0</b> 張</span>
      <span>已熟 <b id="stKnown">0</b> / <span id="stTotal">0</span></span>
      <span class="ttsw">發音
        <button type="button" data-tts="browser" aria-pressed="true" title="使用裝置內建語音">裝置語音</button><button type="button" data-tts="google" aria-pressed="false" title="開啟 Google 翻譯頁面，按喇叭聽發音">Google 翻譯</button>
      </span>
    </div>
    <nav class="tabs zh" role="tablist">
      <button role="tab" data-v="today" aria-selected="true">今日練習</button>
      <button role="tab" data-v="lib" aria-selected="false">詞庫與比較表</button>
      <button role="tab" data-v="quiz" aria-selected="false">選擇測驗</button>
      <button role="tab" data-v="add" aria-selected="false">新增詞彙</button>
    </nav>
  </div>
</header>

<main class="zh">
  <section class="view" id="v-today"></section>
  <section class="view" id="v-lib" hidden><div class="lib"><aside class="side" id="side"></aside><div id="detail"></div></div></section>
  <section class="view" id="v-quiz" hidden></section>
  <section class="view add" id="v-add" hidden></section>
</main>

<script>
// lv: 1 = A2+/B1, 2 = B1, 3 = B1+/B2 ; ctx: L 生活, S Server 機構, M 會議
// fit: w 工作可用, c 口語, ! 小心使用
const SETS = [
  {id:"verbs", name:"動詞搭配", desc:"Have / Take / Do / Make… 常見搭配", src:"Important English Vocabulary"},
  {id:"prep", name:"介系詞", desc:"at / on / in / by / for / with…", src:"12 Important Prepositions、At On In"},
  {id:"native", name:"道地說法", desc:"Basic → Native 40 句", src:"Basic Phrases → Native Phrases"},
  {id:"talk", name:"問答回應", desc:"一個問題，五種回法", src:"One Question → 5 Native Replies"},
  {id:"travel", name:"出差住宿", desc:"飯店入住 20 句", src:"English for Hotel Check-In"},
  {id:"grammar", name:"文法比較", desc:"when vs while", src:"when 和 while 差別"},
  {id:"added", name:"新增單字", desc:"在對話中加入的詞彙", src:""},
];

// 每個詞補上缺少的兩個等級例句（依等級由低到高填入缺的等級）：[ctx, en, zh]
const EX3 = {
have:[
 [["L","We *had a drink* together after the project review.","專案審查後我們一起喝了一杯。"],["M","After the customer visit, our manager invited everyone to *have a drink* and relax.","客戶來訪後，主管請大家去喝一杯放鬆一下。"]],
 [["L","When I come back from a long build, I like to *have a hot bath*.","長時間 build 回來後，我喜歡泡個熱水澡。"],["L","My back hurts after carrying the chassis all day, so I'll *have a bath* tonight.","整天搬機箱背很痛，今晚要泡個澡。"]],
 [["M","Let's *have breakfast* at the hotel and then go to the factory.","我們在飯店吃完早餐再去工廠。"],["S","During the build week, we *have breakfast* at 7 so we can start the line check at 8.","build 那週我們 7 點吃早餐，8 點才能開始產線檢查。"]],
 [["L","I'm tired. I need to *have a rest*.","我好累，需要休息一下。"],["M","We've talked about the bracket for two hours, so let's *have a rest* and come back with fresh eyes.","我們討論 bracket 兩小時了，先休息，回來再用新角度看。"]],
 [["L","I *have lunch* at 12.","我 12 點吃午餐。"],["M","Why don't we *have lunch* with the supplier and talk about the cost-down plan?","我們何不和供應商吃午餐，順便談降成本計畫？"]],
 [["L","I always *have a quick shower* after I go running.","跑步後我都會快速沖個澡。"],["L","The hotel water was cold, so I couldn't *have a shower* before the customer meeting.","飯店水是冷的，客戶會議前沒辦法沖澡。"]]],
take:[
 [["S","After we *take a break*, we'll start the second drop test.","休息完後我們開始第二次落摔測試。"],["M","We've covered the thermal part, so let's *take a short break* before we move on to cable routing.","散熱部分講完了，先短暫休息再進 cable 走線。"]],
 [["M","I sent you the new drawing. Please *take a look* when you have time.","我寄了新圖，有空請看一下。"],["S","Before we release the drawing, could you *take a look at* the tolerance on the latch area?","發圖前，你可以看一下卡勾區的公差嗎？"]],
 [["L","I'm going to *take an English exam* next month, so I practice every day.","我下個月要考英文，所以每天練習。"],["L","Many engineers *take the TOEIC exam* to show their English level to the company.","很多工程師考多益來向公司證明英文程度。"]],
 [["M","Please *take a seat*. The customer will join us in five minutes.","請坐，客戶五分鐘後加入。"],["M","There are not enough chairs, so some people can *take a seat* at the back.","椅子不夠，有些人可以坐到後面。"]],
 [["L","I want to *take a chance* and try a new job.","我想冒險試試新工作。"],["S","Let's not *take a chance*. Please check the screw length again.","我們別冒險，請再確認一次螺絲長度。"]],
 [["L","Can you *take a photo* of us?","可以幫我們拍張照嗎？"],["S","When you find a failure, *take a photo* with a ruler next to it so we can see the size.","發現失效時，旁邊放尺拍照，才看得出尺寸。"]]],
do:[
 [["M","I can't talk now. I need to *do my work* before the deadline.","現在不能聊，截止前我得做完工作。"],["M","If everyone *does their work* on time, we can release the drawings by Friday.","如果大家都準時完成工作，週五前就能發圖。"]],
 [["S","If we *do nothing*, the noise problem will get worse.","如果什麼都不做，噪音問題會更嚴重。"],["M","*Doing nothing* is also a choice, but it may cost us more in the next build.","什麼都不做也是一種選擇，但下次 build 可能代價更高。"]],
 [["L","After dinner, it's my turn to *do the dishes*.","晚餐後輪到我洗碗。"],["L","I usually *do the dishes* while I listen to English podcasts.","我通常邊洗碗邊聽英文 podcast。"]],
 [["L","I *do my hair* in the morning.","我早上整理頭髮。"],["L","She spent twenty minutes *doing her hair* before the company party.","公司派對前她花了二十分鐘弄頭髮。"]],
 [["L","Sitting all day hurts my back, so I *do yoga* after work.","整天坐著背會痛，所以我下班後做瑜珈。"],["L","Since I started to *do yoga*, my neck pain from computer work is much better.","開始做瑜珈後，用電腦造成的脖子痛好多了。"]],
 [["L","Can you *do me a favor*?","可以幫我個忙嗎？"],["M","Could you *do me a favor* and send the 3D file to the supplier before you leave today?","你今天離開前可以幫我把 3D 檔寄給供應商嗎？"]]],
make:[
 [["S","Please clean up after the build. Don't *make a mess* in the lab.","build 後請收拾，不要把實驗室弄亂。"],["M","Changing the part number now will *make a mess* of the BOM, so let's wait for the next ECN.","現在改料號會把 BOM 搞亂，等下一個 ECN 再改。"]],
 [["L","Good shoes *make a difference*.","好鞋子差很多。"],["S","Moving the fan 5 mm closer *made a big difference* in CPU temperature.","把風扇移近 5 mm，CPU 溫度差很多。"]],
 [["L","I *make an effort* to speak English every day.","我每天努力說英文。"],["M","The supplier *made a big effort* to improve the flatness, but it is still out of spec.","供應商很努力改善平面度，但還是超規。"]],
 [["L","My friend *makes money* by selling old parts online.","我朋友在網路上賣舊零件賺錢。"],["M","We don't *make much money* on this project, so every cost-down idea helps.","這個專案賺不多，每個降成本點子都有幫助。"]],
 [["M","We can't *make a decision* until we see the test result.","看到測試結果之前我們無法決定。"],["M","The customer asked us to *make a final decision* on the material by next Wednesday.","客戶要我們下週三前對材料做最後決定。"]],
 [["L","In the hotel, I don't need to *make the bed*.","在飯店我不用整理床。"],["L","My kids learned to *make the bed* by themselves before they go to school.","孩子學會上學前自己整理床鋪。"]]],
go:[
 [["M","I'm going to *go home* early today because my son is sick.","我兒子生病，今天要早點回家。"],["S","We can't *go home* until the burn-in test finishes and the log looks OK.","燒機測試結束、log 正常之前我們不能回家。"]],
 [["L","I *went shopping* for a new jacket last weekend.","上週末我去買新外套。"],["L","When I travel for work, I don't have time to *go shopping*, so I buy gifts at the airport.","出差時沒空逛街，所以在機場買禮物。"]],
 [["L","The kids *go crazy* when they see the snow.","孩子看到雪就瘋了。"],["S","The fan speed *goes crazy* when the sensor reads the wrong temperature.","感測器讀錯溫度時，風扇轉速會亂飆。"]],
 [["L","I want to *go abroad* this summer.","我今年夏天想出國。"],["M","Before I *go abroad* for the customer build, I need to prepare all the test fixtures.","出國跟客戶 build 前，我要準備好所有測試治具。"]],
 [["L","The small shop *went bankrupt*.","那家小店破產了。"],["M","One of our cable suppliers *went bankrupt* last year.","我們一家 cable 供應商去年倒閉了。"]],
 [["L","When I can't solve a problem, I *go for a walk* to think.","解決不了問題時，我會去散步想想。"],["L","After sitting in meetings all morning, I *went for a short walk* to clear my head.","整個早上都在開會，我去散步讓頭腦清醒。"]]],
come:[
 [["L","I *came close to* missing the bus.","我差點沒趕上公車。"],["S","The sample *came close to* passing the drop test.","樣品差一點就通過落摔測試。"]],
 [["L","The summer is *coming to an end*.","夏天快結束了。"],["M","As the project *comes to an end*, let's write a lessons-learned report for the next design.","專案快結束了，我們寫份經驗回顧給下一個設計。"]],
 [["S","On build days, I *come early* to check the parts.","build 那天我會早到檢查零件。"],["M","If you *come early* tomorrow, we can test the new bracket before the customer arrives.","如果你明天早到，可以在客戶來之前先測新 bracket。"]],
 [["M","For this project, cost *comes first*, then weight.","這個專案成本優先，其次是重量。"],["S","When we choose a screw, reliability should *come first*, not the price.","選螺絲時應該可靠度優先，而不是價格。"]],
 [["L","He ran slowly and *came last* in the race.","他跑得慢，比賽最後一名。"],["S","In the airflow simulation, the old design *came last* among the three options.","風流模擬中，舊設計在三個方案裡排最後。"]],
 [["M","Please *come on time*. The customer is very strict.","請準時，客戶很嚴格。"],["S","If the tooling parts don't *come on time*, we will have to use 3D-printed samples for EVT.","模具件如果沒準時到，EVT 只能用 3D 列印樣品。"]]],
get:[
 [["L","My wife *got pregnant* in the spring.","我太太春天懷孕了。"],["M","After my coworker *got pregnant*, we moved some of her lab tasks to other engineers.","同事懷孕後，我們把她部分實驗室工作轉給其他工程師。"]],
 [["L","We *got lost* on the way to the customer's office.","我們去客戶辦公室的路上迷路了。"],["M","Without a clear agenda, it's easy to *get lost* in the details during the meeting.","沒有清楚議程，開會很容易迷失在細節裡。"]],
 [["S","Please *get the fixtures ready* before 9.","請 9 點前準備好治具。"],["M","We need to *get ready for* the design review, so let's finish the slides today.","我們要為設計審查做準備，今天把簡報完成。"]],
 [["S","We *got started* on the new chassis design last week.","我們上週開始新機箱設計。"],["M","Let's *get started* with a quick update, and then we'll go through the open issues.","我們先快速更新進度，再逐一看待解問題。"]],
 [["L","After school, she *got a job* in Hsinchu.","畢業後她在新竹找到工作。"],["L","He *got a job* as a mechanical engineer because of his sheet metal experience.","他因為鈑金經驗而得到機構工程師的工作。"]],
 [["L","They *got married* last year.","他們去年結婚了。"],["M","My coworker *is getting married* next month, so she will take two weeks off.","同事下個月結婚，會請兩週假。"]]],
letme:[
 [["S","*Let me know* when the samples arrive.","樣品到了跟我說。"],["M","Please *let me know* by Thursday if the new schedule doesn't work for your team.","如果新時程對你們團隊不行，請週四前告訴我。"]],
 [["M","That's a good question. *Let me think* for a second.","好問題，讓我想一下。"],["S","*Let me think about* other ways to route the cable before we change the bracket.","改 bracket 之前，讓我想想其他走線方式。"]],
 [["S","That chassis is heavy. *Let me help you* carry it.","機箱很重，我幫你搬。"],["M","If you're not sure how to run the stack-up, *let me help you* set up the first one.","如果不確定怎麼做公差疊加，我幫你設定第一個。"]],
 [["M","*Let me go first*, and then you can show the test data.","我先講，然後你再展示測試數據。"],["M","*Let me go* through the open issues one by one before we talk about the schedule.","談時程前，讓我逐一說明待解問題。"]],
 [["S","*Let me see*... the gap is about 0.8 mm.","我看看…間隙大約 0.8 mm。"],["M","*Let me see* if I can find the old test report and send it to you after the meeting.","我看看能不能找到舊測試報告，會後寄給你。"]],
 [["L","*Let me explain*.","讓我解釋一下。"],["M","*Let me explain* the root cause first, and then we can discuss short-term and long-term actions.","先讓我說明根本原因，再討論短期和長期對策。"]]],
put:[
 [["L","I *put on weight* this year.","我今年變胖了。"],["L","Many engineers *put on weight* during long projects because they eat late and don't exercise.","很多工程師在長專案期間變胖，因為吃得晚又不運動。"]],
 [["S","*Put on* your ESD *jacket* before you touch the PCBA.","碰 PCBA 前先穿上防靜電外套。"],["L","It was raining when I left the hotel, so I *put on a jacket* and took an umbrella.","離開飯店時在下雨，所以我穿上外套並帶了傘。"]],
 [["L","She *puts on makeup* before every video call.","每次視訊會議前她都化妝。"],["L","My daughter is learning to *put on makeup* for her school show.","女兒正在學化妝準備學校表演。"]],
 [["L","In Indian English, people often say *put off the light*, but Americans say *turn off*.","印度英語常說 put off the light，美國人說 turn off。"],["S","Please *turn off the lights* and the power supply before you leave the lab for the weekend.","週末離開實驗室前請關燈並關掉電源供應器。"]],
 [["L","Let's *put off* the trip.","我們延後旅行吧。"],["M","The supplier asked us to *put off the meeting* because their samples failed incoming inspection.","供應商因樣品進料檢驗沒過，請我們延後會議。"]],
 [["L","I *put my desk in order* every Friday.","我每週五整理桌面。"],["M","Before the customer audit, we need to *put all the inspection records in order* by date.","客戶稽核前，我們要把所有檢驗紀錄依日期整理好。"]]],
aoi:[
 [["S","The burn-in test will finish *at 5 PM*.","燒機測試下午 5 點結束。"],["M","If the customer call starts *at 5 PM* our time, it will be early morning in the US.","客戶會議若在我們這邊 5 點開始，美國那邊是清晨。"]],
 [["M","The parts will arrive *at noon*, so we can start the build after lunch.","零件中午到，午餐後就能開始 build。"],["S","We stopped the line *at noon* because the screws didn't match the drawing.","螺絲和圖面不符，我們中午停線。"]],
 [["S","The thermal test runs *at night* when the lab is quiet.","散熱測試在晚上實驗室安靜時跑。"],["M","I often answer emails *at night* because the US team is awake then.","我常晚上回信，因為美國團隊那時醒著。"]],
 [["L","My flight lands *at midnight*.","我的班機午夜降落。"],["M","Please upload the files before 12, because the system closes *at midnight*.","請 12 點前上傳檔案，系統午夜關閉。"]],
 [["L","I left my laptop *at home*, so I can't open the 3D file.","我把筆電放在家，打不開 3D 檔。"],["M","When I work *at home*, I join the morning meeting by video.","在家工作時，我用視訊參加早會。"]],
 [["L","I'm still *at work*. I'll be home late.","我還在公司，會晚點回家。"],["S","I had a problem *at work* today: the cable was 10 mm too short.","今天工作上遇到問題：cable 短了 10 mm。"]],
 [["L","The factory bus picks us up *at the station* at 8.","工廠接駁車 8 點在車站接我們。"],["L","Let's meet *at the station* so we can take the high-speed rail to the factory together.","在車站見，一起搭高鐵去工廠。"]],
 [["L","I waited *at the bus stop* for 20 minutes.","我在公車站等了 20 分鐘。"],["L","There is a coffee shop near the factory, right *at the bus stop*.","工廠附近公車站旁就有一家咖啡店。"]],
 [["S","Leave the sample box *at the door* of the lab.","把樣品箱放在實驗室門口。"],["M","The security guard *at the door* will check your visitor badge.","門口警衛會檢查你的訪客證。"]],
 [["S","The label is *at the rear side*.","標籤在後側。"],["S","Because the cables are *at the rear side*, the service area at the front stays clean.","cable 都在後側，前面的維修區就保持乾淨。"]],
 [["S","The new samples will ship *on Monday*.","新樣品週一出貨。"],["M","If we get the test report *on Monday*, we can still meet the Friday deadline.","週一拿到測試報告的話，仍能趕上週五截止。"]],
 [["M","The design freeze is *on May 15th*.","設計凍結日是 5 月 15 日。"],["M","Because tooling starts *on May 15th*, all drawing changes must be done before that day.","模具 5 月 15 日開始，所有圖面變更必須在那之前完成。"]],
 [["L","My team gave me a cake *on my birthday*.","生日那天團隊送我蛋糕。"],["L","I had to fly to the US *on my birthday*, so we celebrated a week later.","生日那天我得飛美國，所以晚一週才慶祝。"]],
 [["S","Put the samples *on the table*, not on the floor.","樣品放桌上，不要放地上。"],["S","Before the drop test, we put the unit *on the table* and measured all the gaps.","落摔前把機台放桌上量所有間隙。"]],
 [["L","There is a big clock *on the wall* in the meeting room.","會議室牆上有大時鐘。"],["S","The safety rules are *on the wall*, so everyone can read them before entering the lab.","安全規則貼在牆上，進實驗室前大家都能看到。"]],
 [["M","Please look at the table *on page 5* of the report.","請看報告第 5 頁的表格。"],["M","The stack-up result *on page 5* shows the worst case is only 0.1 mm.","第 5 頁的公差疊加結果顯示最差狀況只有 0.1 mm。"]],
 [["L","I learned some English from shows *on TV*.","我從電視節目學了些英文。"],["L","I saw a news report *on TV* about new AI data centers in Taiwan.","我在電視上看到台灣新 AI 資料中心的新聞。"]],
 [["S","The chip is *on the PCBA*.","晶片在 PCBA 上。"],["S","The tall capacitor *on the PCBA* is very close to the top cover, so check the clearance.","PCBA 上的高電容很靠近上蓋，請確認間隙。"]],
 [["M","We will start the DVT build *in April*.","我們四月開始 DVT build。"],["M","If the customer approves the design *in April*, mass production can start in July.","客戶若四月核准設計，七月就能量產。"]],
 [["S","Our company will launch a new L11 rack *in 2026*.","公司 2026 年會推出新的 L11 機櫃。"],["M","*In 2026*, more customers are asking for liquid cooling in their racks.","2026 年有更多客戶要求機櫃使用液冷。"]],
 [["M","Let's have the design review *in the morning*.","設計審查早上開吧。"],["S","*In the morning*, the lab is cold, so we wait for the room to warm up before testing.","早上實驗室很冷，我們等室溫上來再測。"]],
 [["S","Please don't eat *in the room* where we test the PCBA.","測 PCBA 的房間請不要吃東西。"],["M","Can everyone *in the room* see the screen, or should I make the font bigger?","會議室裡大家都看得到螢幕嗎？要不要放大字？"]],
 [["M","Our office is *in Taipei*, but the factory is in Taoyuan.","我們辦公室在台北，工廠在桃園。"],["M","The customer team will stay *in Taipei* for three days for the design review.","客戶團隊會在台北待三天參加設計審查。"]],
 [["S","Don't leave the samples *in the car*. It gets very hot.","別把樣品放車上，會很熱。"],["L","I listen to English podcasts *in the car* on my way to work.","上班途中我在車上聽英文 podcast。"]],
 [["S","Each sample comes *in a box* with a label.","每個樣品都裝在有標籤的盒子裡。"],["S","Please pack the failed parts *in a box* and write the failure mode on the outside.","請把失效零件裝箱，並在外面寫失效模式。"]],
 [["S","The fans are *in the chassis*.","風扇在機箱裡。"],["S","Hot air stays *in the chassis* if the cables block the airflow path.","如果 cable 擋住風流路徑，熱風會留在機箱內。"]]],
bfw:[
 [["L","It takes 40 minutes to get to the office *by bus*.","搭公車到公司要 40 分鐘。"],["L","When it rains, I go to work *by bus* instead of by scooter.","下雨時我改搭公車上班，不騎機車。"]],
 [["L","It's faster to go to Hsinchu *by train*.","搭火車去新竹比較快。"],["M","We'll send the urgent samples *by train*, because the courier can't deliver until tomorrow.","急件樣品用火車送，因為快遞明天才能送到。"]],
 [["S","I set up the test fixture *by myself*.","我自己架設測試治具。"],["S","It's hard to install the 30 kg chassis *by myself*, so I need one more person.","自己裝 30 公斤的機箱很難，我需要多一個人。"]],
 [["M","Sorry, I sent the old drawing *by mistake*.","抱歉，我不小心寄了舊圖。"],["S","Someone used M3 x 8 screws *by mistake*, so the screws touched the PCBA.","有人不小心用了 M3 x 8 螺絲，結果碰到 PCBA。"]],
 [["L","I need the book *by Friday*.","我週五前需要這本書。"],["M","If we don't get the material data *by Friday*, the simulation will be delayed one week.","週五前拿不到材料數據，模擬會延後一週。"]],
 [["M","I have a question *for you* about the BOM.","我有個 BOM 的問題要問你。"],["M","I made a short summary *for you*, so you don't need to read the whole report.","我幫你做了摘要，你不用看整份報告。"]],
 [["M","The meeting lasted *for two hours*.","會議開了兩小時。"],["S","We ran the fan at full speed *for two hours* to check the vibration on the HDD.","風扇全速跑兩小時，檢查硬碟振動。"]],
 [["L","My neighbor's car is *for sale*.","鄰居的車在賣。"],["M","This model is no longer *for sale*, so we need to find a new part.","這型號已經停售，我們得找新零件。"]],
 [["L","We had beef noodles *for dinner*.","我們晚餐吃牛肉麵。"],["M","The customer invited our team *for dinner* after the successful build.","build 順利後，客戶請我們團隊吃晚餐。"]],
 [["M","This file is *for the review*.","這個檔案是審查要用的。"],["S","We need three more samples *for the review*, because the customer wants to check the assembly.","審查還需要三個樣品，因為客戶要看組裝。"]],
 [["L","I practice English *with friends* every Saturday.","我每週六和朋友練英文。"],["L","I went to Japan *with friends* last year, and I had to speak English all the time.","去年和朋友去日本，一直都得講英文。"]],
 [["S","Mark the scratch *with a pen* so we can find it later.","用筆標出刮傷，之後才找得到。"],["S","Please don't write on the sample *with a pen*. Use a label instead.","請不要用筆在樣品上寫字，改用標籤。"]],
 [["L","She makes lunch for her kids *with love*.","她用愛為孩子做午餐。"],["L","My kids always sign their birthday cards to me *with love*.","孩子給我的生日卡片都會寫「with love（愛你）」。"]],
 [["L","Speak *with confidence*.","說話要有自信。"],["M","After practicing three times, I presented the root cause *with confidence*.","練習三次後，我很有自信地報告根本原因。"]],
 [["S","I work *with a torque driver* every day.","我每天都用扭力起子工作。"],["S","If you tighten the screw *with a torque driver* set too high, the boss may crack.","扭力起子設太高鎖螺絲，螺絲柱可能會裂。"]]],
fta:[
 [["M","The new project manager is *from Bangalore*, and she speaks very fast.","新 PM 來自班加羅爾，講話很快。"],["M","Engineers *from Bangalore* will join our call to review the firmware and mechanical issues.","班加羅爾的工程師會加入會議，檢討韌體和機構問題。"]],
 [["L","I pick my son up *from school* on Wednesdays.","我週三接兒子放學。"],["L","Some of the English I learned *from school* is useful, but meeting English is very different.","學校學的英文有些有用，但會議英文很不一樣。"]],
 [["L","*From today*, I will study English every day.","從今天起我每天念英文。"],["S","*From today*, all new brackets must pass the salt spray test before release.","從今天起，所有新 bracket 發行前都要通過鹽霧測試。"]],
 [["L","I heard about this English app *from my friend*.","我從朋友那聽說這個英文 App。"],["S","I got some good advice *from my friend* about designing snap fits for plastic parts.","我從朋友那得到塑膠件卡勾設計的好建議。"]],
 [["S","The box is *from the supplier*.","這箱是供應商送來的。"],["M","We are still waiting for the 8D report *from the supplier* about the flatness problem.","我們還在等供應商關於平面度問題的 8D 報告。"]],
 [["L","I walk my daughter *to school* before work.","上班前我陪女兒走路上學。"],["L","When I was young, I rode my bike *to school* even on rainy days.","小時候即使下雨我也騎腳踏車上學。"]],
 [["M","Please send the file *to me* by email.","請用 email 把檔案寄給我。"],["M","If the supplier has any questions about the drawing, they can come *to me* directly.","供應商若有圖面問題，可以直接來找我。"]],
 [["L","It takes me 15 minutes to walk *to work*.","我走路上班要 15 分鐘。"],["L","Since I started walking *to work*, I feel less tired in the afternoon.","開始走路上班後，下午比較不累。"]],
 [["M","Our manager will fly *to Delhi* to meet the customer.","主管會飛德里見客戶。"],["M","Before we fly *to Delhi* for the build, we must ship the fixtures one week early.","飛德里 build 前，治具必須提早一週寄出。"]],
 [["M","I sent it *to the customer*.","我寄給客戶了。"],["M","Before we send the drawing *to the customer*, let's check the notes and the revision table.","寄圖給客戶前，先檢查註解和版次表。"]],
 [["L","My coworkers like to talk *about movies* during lunch.","同事午餐時喜歡聊電影。"],["L","Talking *about movies* with foreign coworkers is an easy way to practice English.","和外國同事聊電影是練英文的簡單方法。"]],
 [["L","My son reads books *about space* before bed.","我兒子睡前看太空的書。"],["S","I read an article *about space* servers that use special cooling systems.","我讀到一篇關於太空伺服器使用特殊散熱系統的文章。"]],
 [["M","I'm not sure yet. Can I think *about it* tonight?","我還不確定，今晚想一想好嗎？"],["M","The idea sounds good, but let's think *about it* more before we change the tooling.","點子聽起來不錯，但改模前再多想想。"]],
 [["L","This app helps me learn *about English* phrases.","這個 App 幫我學英文片語。"],["M","I want to learn more *about English* for meetings, not only grammar.","我想多學會議英文，不只是文法。"]],
 [["M","Let's talk *about the noise*.","我們談談噪音。"],["S","The customer complained *about the noise issue*, so we added rubber pads to the fans.","客戶抱怨噪音問題，所以我們在風扇加了橡膠墊。"]]],
uob:[
 [["S","There are some screws *under the table*. Please pick them up.","桌子下有些螺絲，請撿起來。"],["S","We put the power cables *under the table* so nobody trips over them.","把電源線放桌下，免得有人絆倒。"]],
 [["L","I keep my suitcase *under the bed*.","我把行李箱放床下。"],["L","My son hid his phone *under the bed* so he could play games at night.","兒子把手機藏在床下，晚上偷玩遊戲。"]],
 [["L","There is a bike path *under the bridge*.","橋下有條腳踏車道。"],["L","We stopped *under the bridge* because it suddenly started to rain.","突然下雨，我們在橋下躲雨。"]],
 [["L","I'm *under pressure* at work.","我工作壓力很大。"],["M","When we work *under pressure*, it's easy to skip checks, so please follow the checklist.","在壓力下工作很容易漏檢，請照檢查表做。"]],
 [["S","There is a gap *under the PCBA*.","PCBA 下方有間隙。"],["S","The standoffs *under the PCBA* must be the same height, or the board will bend.","PCBA 下方的支撐柱高度要一致，否則板子會彎。"]],
 [["L","There is a big light *over the table* in our meeting room.","會議室桌子上方有一盞大燈。"],["S","We hung a camera *over the table* to record the assembly process.","我們在桌子上方掛相機，錄下組裝過程。"]],
 [["L","I walk *over the bridge* to get to the factory.","我走過橋去工廠。"],["L","The truck with our racks couldn't go *over the bridge* because it was too heavy.","載機櫃的卡車太重，不能過橋。"]],
 [["M","The supplier will fix the tooling *over the weekend*.","供應商週末會修模。"],["M","Can you think about the two options *over the weekend* and tell me your choice on Monday?","你週末可以想想兩個方案，週一告訴我選哪個嗎？"]],
 [["L","My English got better *over the years*.","這些年我的英文進步了。"],["S","*Over the years*, servers have become heavier, so rails and racks need stronger designs.","這些年伺服器越來越重，滑軌和機櫃需要更強的設計。"]],
 [["S","Don't put the box *over the cable*.","不要把箱子壓在 cable 上。"],["S","If the top cover presses *over the cable*, the cable may get damaged during vibration.","上蓋若壓在 cable 上，振動時 cable 可能受損。"]],
 [["L","It's windy *between the buildings*.","建築物之間風很大。"],["S","The company built a bridge *between the buildings* so we can move racks easily.","公司在兩棟建築之間蓋了天橋，方便搬機櫃。"]],
 [["L","This is just *between you and me*.","這只是你我之間的事。"],["M","*Between you and me*, I don't think the supplier can meet the new schedule.","私下說，我不認為供應商能趕上新時程。"]],
 [["M","The customer call is *between 9 and 10* tomorrow.","客戶會議明天 9 到 10 點之間。"],["S","The truck will arrive *between 9 and 10*, so please clear the loading area before that.","卡車 9 到 10 點到，請在那之前清空卸貨區。"]],
 [["L","I have to choose *between two choices*.","我得在兩個選擇中挑一個。"],["M","Choosing *between two choices* is easier when we compare cost, weight, and risk in one table.","用一張表比較成本、重量和風險，二選一就容易多了。"]],
 [["S","There is a wall *between the two fans*.","兩顆風扇之間有隔板。"],["S","Without a divider *between the two fans*, hot air may flow back and reduce cooling.","兩顆風扇之間若沒隔板，熱風可能回流，降低散熱效果。"]]],
np1:[
 [["M","You stayed late to help me with the test. I really *appreciate it*.","你留下來幫我測試，真的很感謝。"],["M","Thanks for sharing the old failure data with our team. We *appreciate it*, and it saved us a week.","謝謝分享舊失效數據，很感謝，幫我們省了一週。"]],
 [["M","A: Thanks for checking the BOM. B: *Anytime.* Just send it to me.","A：謝謝檢查 BOM。B：隨時，寄給我就好。"],["M","A: Your stack-up tips really helped. B: *Anytime.* Let me know if you get stuck again.","A：你的公差建議很有幫助。B：隨時，卡住再跟我說。"]],
 [["M","A: Sorry, I forgot to send the file. B: *No worries.* Send it when you can.","A：抱歉忘了寄檔。B：沒關係，有空再寄。"],["M","A: I'm sorry the samples are one day late. B: *No worries.* We can still finish the test on time.","A：抱歉樣品晚一天。B：沒關係，我們還是能準時測完。"]],
 [["S","A: So we need a longer cable? B: *Exactly*, about 20 mm longer.","A：所以要更長的 cable？B：沒錯，大約長 20 mm。"],["M","A: The problem isn't the screw, it's the boss height. B: *Exactly.* That's why we should fix the tooling.","A：問題不是螺絲，是螺絲柱高度。B：沒錯，所以應該修模。"]],
 [["M","A: Please use the new revision. B: *Got it*, thanks.","A：請用新版次。B：了解，謝謝。"],["M","*Got it.* I'll change the hole size to 3.2 mm and send you the updated drawing this afternoon.","了解，我把孔徑改成 3.2 mm，下午寄更新的圖給你。"]],
 [["L","A: Where is my phone? B: *No idea.*","A：我手機在哪？B：不知道。"],["M","I have *no idea* why the noise only happens at 60% fan speed, so let's test more units.","我完全不知道為什麼噪音只在 60% 轉速出現，多測幾台吧。"]],
 [["L","After three days of builds, *I'm beat*.","連續三天 build，我累壞了。"],["L","*I'm beat*, but I still want to practice English for 15 minutes before I sleep.","我累壞了，但睡前還是想練 15 分鐘英文。"]],
 [["L","We skipped lunch for the test, so *I'm starving*.","為了測試沒吃午餐，我餓扁了。"],["M","*I'm starving*. Can we take a break and order some food before we continue?","我餓扁了，可以休息一下點餐再繼續嗎？"]],
 [["M","Sorry, *I'm tied up*.","抱歉，我走不開。"],["M","*I'm tied up* with the customer audit all day, so please ask Kevin about the drawing.","我整天被客戶稽核綁住，圖面的事請問 Kevin。"]],
 [["M","*Hang on*, I can't hear you. Let me check my microphone.","等一下，我聽不到你，我檢查一下麥克風。"],["S","*Hang on*. Before you close the cover, let me check that the cable isn't pinched.","等一下，蓋上蓋子前讓我確認 cable 沒被夾到。"]],
 [["S","*Watch out* for the cable on the floor.","小心地上的 cable。"],["S","*Watch out* when you pull the server out of the rack, because it's heavier than it looks.","從機櫃拉出伺服器時要小心，它比看起來重。"]],
 [["L","*Come on*, you can do it!","加油，你做得到！"],["M","*Come on*, we talked about this last week. We need to decide today.","拜託，這上週就談過了，今天必須決定。"]],
 [["L","You worked late all week. *Take it easy* this weekend.","你整週加班，週末放輕鬆吧。"],["M","*Take it easy*. One failed sample doesn't mean the whole design is wrong.","放輕鬆，一個樣品失效不代表整個設計錯了。"]],
 [["L","Can you *keep it down*? The baby is sleeping.","可以小聲點嗎？寶寶在睡。"],["M","Could you guys *keep it down* a little? I'm on a call with the customer.","你們可以小聲一點嗎？我在跟客戶通話。"]],
 [["L","Why don't you *come over* for dinner on Saturday?","週六來我家吃晚餐吧？"],["S","When you have time, please *come over* to the lab and check the new sample with me.","有空請來實驗室和我一起看新樣品。"]],
 [["M","Please *have a seat*. Can I get you some water?","請坐，要喝水嗎？"],["M","*Have a seat* anywhere you like. We'll start after everyone joins online.","隨便坐，線上的人都加入後就開始。"]],
 [["M","*Come on in*. We're just setting up the projector.","進來吧，我們正在架投影機。"],["S","*Come on in* and take a look. The new rack is already installed.","進來看看吧，新機櫃已經裝好了。"]],
 [["L","*Hang tight.* I'm coming.","等一下，我來了。"],["M","*Hang tight*. The supplier is checking the stock, and they'll call us back in ten minutes.","稍等，供應商在查庫存，十分鐘內回電。"]],
 [["S","*Let me know* if the screw doesn't fit.","螺絲裝不上請跟我說。"],["M","*Let me know* which option you prefer, and I'll update the 3D model tonight.","告訴我你偏好哪個方案，我今晚更新 3D。"]],
 [["M","If the line stops, *give me a call* right away.","產線停了請馬上打給我。"],["M","*Give me a call* after you talk to the supplier, so we can decide the next step together.","和供應商談完打給我，我們一起決定下一步。"]]],
np2:[
 [["M","I have another meeting now. *Catch you later*.","我現在有另一個會，待會見。"],["M","I'll send the summary after lunch. *Catch you later* in the design review.","午餐後寄摘要，設計審查時見。"]],
 [["M","A: Is the meeting room ready? B: Yes, we're *all set*.","A：會議室好了嗎？B：好了，都準備好了。"],["S","Once the cables are labeled and the fixtures are calibrated, we'll be *all set* for the build.","cable 貼好標籤、治具校正完，build 就都準備好了。"]],
 [["L","We're *heading out* for lunch. Do you want to come?","我們要去吃午餐，要一起嗎？"],["M","I'm *heading out* to the factory now, so I'll join the call from my phone.","我正要去工廠，會用手機加入會議。"]],
 [["L","Sorry, *I'm lost*.","抱歉，我聽不懂。"],["M","*I'm a bit lost* on the new process. Could you explain it again with an example?","新流程我有點搞不清楚，可以用例子再解釋一次嗎？"]],
 [["M","*No way!* The customer wants the samples next week?","不會吧！客戶下週就要樣品？"],["M","There's *no way* we can finish the tooling in two weeks. We need at least five.","兩週不可能完成模具，至少要五週。"]],
 [["L","Thanks, *that'll do*.","謝謝，這樣就好。"],["S","We don't need a perfect simulation for this bracket. A quick check *will do*.","這個 bracket 不需要完美模擬，快速檢查就夠了。"]],
 [["M","I'll give you 100 more ECNs. *Just kidding!*","我再給你 100 個 ECN，開玩笑的！"],["M","*Just kidding* about the deadline. You still have until next Friday.","截止日是開玩笑的，你到下週五都還有時間。"]],
 [["L","*Don't sweat it.* It's OK.","別在意，沒事。"],["M","*Don't sweat it*. The scratch is on the inside, so the customer won't see it.","別擔心，刮傷在內側，客戶看不到。"]],
 [["S","Changing the screw length is a *piece of cake*.","改螺絲長度小菜一碟。"],["S","Once you understand the stack-up method, this kind of problem is a *piece of cake*.","懂了公差疊加方法後，這種問題就小菜一碟。"]],
 [["L","The hotel is nice, but *it's pricey*.","這飯店不錯，但有點貴。"],["M","Aluminum would be lighter, but *it's pricey*, so let's compare it with steel first.","鋁比較輕但有點貴，先和鋼材比較一下。"]],
 [["L","This question is *tricky*.","這題有點棘手。"],["S","*It's tricky* to keep the 0.5 mm gap because both the sheet metal and the plastic have tolerances.","要維持 0.5 mm 間隙很棘手，因為鈑金和塑膠都有公差。"]],
 [["M","You finished the drawing already? *Awesome*, thanks!","圖已經畫完了？太棒了，謝謝！"],["M","*Awesome* work, everyone. The customer passed all our samples in the first round.","大家做得太棒了，客戶第一輪就通過所有樣品。"]],
 [["L","The food at that hotel was *awful*.","那間飯店的食物很難吃。"],["S","The paint quality on the first batch was *awful*, so we sent all of it back to the supplier.","第一批烤漆品質很糟，全部退回供應商。"]],
 [["L","I'm *exhausted* after the long flight.","長途飛行後我累壞了。"],["M","The team is *exhausted* after two weeks of overtime, so let's not plan anything this weekend.","團隊加班兩週累垮了，這週末別安排事情。"]],
 [["L","The meeting went over time, and now I'm *starving*.","會議超時，現在我餓扁了。"],["S","We were *starving* after the 10-hour build, so we ate at the night market.","10 小時 build 後我們餓扁了，去夜市吃東西。"]],
 [["L","I'm *thrilled*!","我超開心！"],["M","We're *thrilled* that the customer chose our design for their next-generation rack.","客戶選我們的設計做下一代機櫃，我們超開心。"]],
 null, // removed: Swamped
 [["M","A: Do you want to review it now? B: *Maybe later*. I'm busy.","A：要現在看嗎？B：晚點吧，我在忙。"],["M","That's a good idea, but *maybe later*. Let's fix the cable problem first.","好主意，但晚點再說，先解決 cable 問題。"]],
 [["M","A: I'm two minutes late. B: *No biggie*.","A：我晚了兩分鐘。B：小事。"],["S","A: I used the wrong label on one box. B: *No biggie*, just replace it before shipping.","A：有一箱貼錯標籤。B：小事，出貨前換掉就好。"]],
 [["L","Tell me. *I'm all ears.*","說吧，我洗耳恭聽。"],["M","If anyone has an idea to reduce the weight by 1 kg, *I'm all ears*.","如果有人有減重 1 公斤的點子，我洗耳恭聽。"]]],
hotel:[
 [["L","Good evening. *I have a reservation under* my company's name for three nights.","晚安，我用公司名稱訂了三晚。"],["M","*I have a reservation under* Lin, but my coworker will also stay in the same room.","我用 Lin 的名字訂房，但同事也會住同一間。"]],
 [["M","*I'm here to* see Mr. Brown. We have a meeting at 10.","我來找 Brown 先生，我們 10 點有會。"],["S","*I'm here to* support the build, so could you show me where the test area is?","我來支援 build，可以帶我看測試區在哪嗎？"]],
 [["L","*What time does* breakfast *start*?","早餐幾點開始？"],["S","*What time does* the night shift *start*? I want to check the first units they build.","夜班幾點開始？我想檢查他們組的第一批機台。"]],
 [["L","*What time is check-out*? Can I stay until noon?","幾點退房？可以待到中午嗎？"],["L","*What time is check-out*? My flight is late, so I may need to leave my bags.","幾點退房？我班機很晚，可能需要寄放行李。"]],
 [["L","*Could I take a look at* the room before I pay?","付款前我可以看一下房間嗎？"],["M","*Could I take a look at* the inspection report before we sign off on the samples?","簽核樣品前，我可以看一下檢驗報告嗎？"]],
 [["L","*Does the room include* breakfast?","房間含早餐嗎？"],["M","*Does the quote include* the tooling cost, or is that a separate charge?","報價含模具費嗎？還是另外收費？"]],
 [["L","*Is* breakfast *included*?","有含早餐嗎？"],["M","*Is* shipping to the US *included* in this price, or do we need to pay extra?","這個價格含寄到美國的運費嗎？還是要另外付？"]],
 [["M","*What's the* password for the meeting room screen?","會議室螢幕的密碼是什麼？"],["M","*What's the* best way to send you big 3D files, email or a shared folder?","寄大型 3D 檔給你最好的方式是什麼，email 還是共用資料夾？"]],
 [["S","*Where's the* test report for unit #5?","5 號機的測試報告在哪？"],["S","*Where's the* latest drawing? I can only find revision B on the server.","最新圖在哪？伺服器上我只找得到 B 版。"]],
 [["L","*How do I get to* the train station *from here*?","從這裡怎麼去火車站？"],["L","*How do I get to* the factory *from here* if I don't have a car?","沒車的話，從這裡怎麼去工廠？"]],
 [["L","*Is there* a convenience store *nearby*?","附近有便利商店嗎？"],["L","*Is there* a quiet coffee shop *nearby* where I can work on my laptop?","附近有安靜的咖啡店可以用筆電工作嗎？"]],
 [["L","*Could I get an extra* key?","可以多一把鑰匙嗎？"],["M","*Could I get an extra* copy of the drawing for the line leader?","可以多給一份圖面給產線組長嗎？"]],
 [["L","*Could I get a late checkout*?","可以晚點退房嗎？"],["L","*Could I get a late checkout*? The customer meeting ends at 1, and I want to change clothes.","可以晚點退房嗎？客戶會議 1 點結束，我想換衣服。"]],
 [["L","*Can I leave my bags here for a while*? I'll be back at 5.","行李可以先放這裡嗎？我 5 點回來。"],["S","*Can I leave* the fixtures *here for a while* until the shipping company picks them up?","治具可以先放這裡，等貨運來收嗎？"]],
 [["L","The room is *a little too* hot.","房間有點太熱。"],["S","The screw is *a little too* long, so it touches the PCBA when we tighten it.","螺絲有點太長，鎖緊時會碰到 PCBA。"]],
 [["L","The TV in my room *isn't working*.","我房間的電視壞了。"],["M","The video link *isn't working*, so I'll share my screen with another tool.","視訊連結無法用，我改用別的工具分享螢幕。"]],
 [["L","*Could I get some extra* pillows?","可以多給些枕頭嗎？"],["S","*Could I get some extra* samples? We need five more for the vibration test.","可以多給一些樣品嗎？振動測試還需要五個。"]],
 [["L","*Could someone give me a hand* with my luggage?","有人能幫我拿行李嗎？"],["S","*Could someone give me a hand* holding the rail while I tighten the screws?","我鎖螺絲時，有人能幫我扶一下滑軌嗎？"]],
 [["L","*I'm ready to check out*. Here is my key card.","我要退房了，這是房卡。"],["M","*I'm ready to* present the test results whenever everyone has joined.","大家到齊我就可以報告測試結果。"]],
 [["L","*Thanks for your help!* The room is great.","謝謝幫忙！房間很棒。"],["M","*Thanks for your help* with the failure analysis. We found the root cause much faster.","謝謝協助失效分析，我們更快找到根本原因。"]]],
qa1:[
 [["M","A: How are you today? B: *Not too bad.* A little tired from the build.","A：今天好嗎？B：還不錯，build 有點累。"],["M","A: How are you doing? B: *Can't complain.* The project is busy, but everything is on schedule.","A：你好嗎？B：沒什麼好抱怨的，專案很忙但進度正常。"]],
 [["L","A: Hey, what's up? B: *Same as always.* Lots of meetings.","A：嘿，怎樣？B：老樣子，很多會。"],["S","A: What's up? B: *Not much*, just checking the clearance between the cable and the heatsink.","A：在幹嘛？B：沒什麼，在檢查 cable 和散熱片的間隙。"]],
 [["L","A: What are you doing this weekend? B: *Running errands*, and maybe a movie.","A：週末做什麼？B：辦些雜事，可能看場電影。"],["S","A: What are you doing? B: *Finishing some work* on the stack-up before I send it to the customer.","A：在做什麼？B：寄給客戶前在完成公差疊加。"]],
 [["M","A: Are you busy? B: *Not really.* What do you need?","A：在忙嗎？B：還好，需要什麼？"],["M","A: Are you busy right now? B: *A little*, but I'll be free after this call, around 3.","A：現在忙嗎？B：有點，但這通電話後大約 3 點有空。"]],
 [["L","A: Where are you? B: *I'm nearby.* See you in five minutes.","A：你在哪？B：在附近，五分鐘後見。"],["S","A: Where are you? The samples just arrived. B: *I'm on my way* back from the supplier. *Almost there.*","A：你在哪？樣品剛到。B：正從供應商那回來，快到了。"]]],
qa2:[
 [["S","A: Can you help me move this rack? B: *Of course.*","A：能幫我搬這個機櫃嗎？B：當然。"],["M","A: Can you help me review the DFM report? B: *Absolutely.* Send it over and I'll check it this afternoon.","A：能幫我看 DFM 報告嗎？B：當然，寄過來我下午看。"]],
 [["M","A: Are you ready to present? B: *Ready to go.*","A：準備好報告了嗎？B：準備好了。"],["S","A: Are you ready for the customer build? B: *I'm all set.* The fixtures and spare parts are packed.","A：準備好客戶 build 了嗎？B：都好了，治具和備品都打包了。"]],
 [["M","A: What do you think of the new schedule? B: *Sounds good* to me.","A：新時程你覺得呢？B：我覺得可以。"],["S","A: What do you think about using die-cast instead of sheet metal? B: *I'm not sure.* The cost may be too high.","A：用壓鑄取代鈑金你覺得呢？B：不確定，成本可能太高。"]],
 [["L","A: Do you like your new job? B: *I love it.*","A：喜歡新工作嗎？B：很喜歡。"],["S","A: Do you like the new rail design? B: *It's okay*, but it's still hard to install with one hand.","A：喜歡新滑軌設計嗎？B：還可以，但單手還是很難裝。"]],
 [["L","A: See you later. B: *Take care.* Drive safe.","A：再見。B：保重，開車小心。"],["M","A: See you later. B: *Talk soon.* I'll send you the meeting notes tonight.","A：再見。B：再聯絡，我今晚寄會議記錄給你。"]]],
ww:[
 [["S","The screw broke *when* I tightened it.","我鎖的時候螺絲斷了。"],["M","I was presenting the test data *when* the customer suddenly asked about the cost.","我在報告測試數據時，客戶突然問起成本。"]],
 [["S","*While* I was checking the drawing, my coworker was preparing the samples.","我看圖的時候，同事在準備樣品。"],["M","*While* the US team was sleeping, we finished the test and uploaded the report.","美國團隊睡覺時，我們完成測試並上傳報告。"]],
 [["S","Tell me *when* the parts arrive.","零件到的時候告訴我。"],["M","*When* you finish the stack-up, please send it to me and the PM.","完成公差疊加時，請寄給我和 PM。"]],

  return {id, set:"custom", kind:"custom", title:g.title||"My words", zh:g.zh||"", core:g.core||"", compare:Array.isArray(g.compare)?g.compare:[], ladder:Array.isArray(g.ladder)?g.ladder:[],
    items:(g.items||[]).map((x,i)=>{ const exs = Array.isArray(x.exs) ? x.exs : Array.isArray(x.ex) ? (Array.isArray(x.ex[0]) ? x.ex : [x.ex]) : [[1,"L",x.en,""]];
      return {key:id+":"+i, en:x.en, zh:x.zh, note:x.note||"", fit:x.fit||"", basic:x.basic||"", ex:exs[0], exs:exs.slice().sort((a,b)=>a[0]-b[0])}; })};

/* ---------- storage ---------- */
let P = {marks:{}, days:{}, queue:null};
let CUSTOM = [];
const Store = {
  db:null, base:null, timer:null,
  local(k, v){ try{ if (v === undefined){ const s = localStorage.getItem("del:"+k); return s ? JSON.parse(s) : null; } localStorage.setItem("del:"+k, JSON.stringify(v)); }catch(e){ return null; } },
  async init(){
    const lp = this.local("progress"); if (lp) P = Object.assign(P, lp);
    const lc = this.local("custom"); if (Array.isArray(lc)) CUSTOM = lc;
    try{
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id(); if (!uid) return;
      this.db = db; this.base = "data/users/"+uid;
      const snap = await db.collection(this.base).get();
      let gotProgress = false; const cs = [];
      snap.docs.forEach(d => {
        const data = d.data() || {};
        try{
          if (d.id === "progress" && data.json){ P = Object.assign({marks:{},days:{},queue:null}, JSON.parse(data.json)); gotProgress = true; }
          else if (d.id.startsWith("g_") && data.json){ cs.push(JSON.parse(data.json)); }
        }catch(e){}
      });
      if (!gotProgress && (Object.keys(P.marks).length || Object.keys(P.days).length)) this.saveProgress(true);
      if (cs.length) CUSTOM = cs.sort((a,b)=>(a.created||0)-(b.created||0));
      else if (CUSTOM.length) CUSTOM.forEach(g => this.saveCustom(g));
      this.local("progress", P); this.local("custom", CUSTOM);
      refreshAll();
    }catch(e){ console.warn("db unavailable", e); }
  },
  saveProgress(now){
    this.local("progress", P);
    if (!this.db) return;
    clearTimeout(this.timer);
    const go = () => this.db.doc(this.base+"/progress").set({json:JSON.stringify(P), at:Date.now()}).catch(e=>console.warn(e));
    if (now) go(); else this.timer = setTimeout(go, 1500);
  },
  async saveCustom(g){
    this.local("custom", CUSTOM);
    if (this.db) await this.db.doc(this.base+"/"+g.id).set({json:JSON.stringify(g)}).catch(e=>console.warn(e));
  },
  async deleteCustom(id){
    this.local("custom", CUSTOM);
    if (this.db) await this.db.doc(this.base+"/"+id).delete().catch(e=>console.warn(e));
  }
};

/* ---------- speech ---------- */
let VOICE = null;
function pickVoice(){
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  VOICE = vs.find(v => /en-US/i.test(v.lang) && /Samantha|Google|Aria|Jenny|Natural/i.test(v.name)) || vs.find(v => /en-US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let TTS_MODE = (function(){ try{ return localStorage.getItem("del:tts") || "browser"; }catch(e){ return "browser"; } })();
function setTtsMode(m){ TTS_MODE = m; try{ localStorage.setItem("del:tts", m); }catch(e){} document.querySelectorAll("[data-tts]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tts === m))); }
const gtUrl = (t) => "https://translate.google.com/?sl=en&tl=zh-TW&op=translate&text=" + encodeURIComponent(plain(t).replace(/\b[AB]: /g, ""));
function openGoogle(t){ const w = window.open(gtUrl(t), "_blank", "noopener"); if (!w) toast("瀏覽器擋下了新分頁。請允許彈出視窗，或長按 ▶ 旁的 G 連結開啟。"); }
let toastTimer = null;
function toast(html, ms){
  let el = document.getElementById("toast");
  if (!el){ el = document.createElement("div"); el.id = "toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.innerHTML = html; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, ms || 7000);
}
function speak(text){
  if (TTS_MODE === "google") { openGoogle(text); return; }
  const fail = () => toast(`這個瀏覽器沒有發出聲音。<button class="btn ghost" type="button" id="tGo">改用 Google 翻譯發音</button>`, 9000);
  if (!("speechSynthesis" in window)) { fail(); bindFail(text); return; }
  const synth = window.speechSynthesis;
  let started = false;
  try{
    if (synth.speaking || synth.pending) synth.cancel();
    const u = new SpeechSynthesisUtterance(plain(text).replace(/\b[AB]: /g, ""));
    u.lang = "en-US"; u.rate = 0.9;
    if (!VOICE) pickVoice();
    if (VOICE) u.voice = VOICE;
    u.onstart = () => { started = true; };
    u.onerror = (e) => { if (!started && e.error !== "interrupted" && e.error !== "canceled") { fail(); bindFail(text); } };
    synth.resume();
    setTimeout(() => { synth.speak(u); }, 60);
    setTimeout(() => { if (!started && !synth.speaking) { fail(); bindFail(text); } }, 2500);
  }catch(e){ fail(); bindFail(text); }
}
function bindFail(text){
  const b = document.getElementById("tGo");
  if (b) b.onclick = () => { setTtsMode("google"); openGoogle(text); document.getElementById("toast").hidden = true; };
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-say]"); if (b){ e.stopPropagation(); speak(b.getAttribute("data-say")); return; }
  const m = e.target.closest("[data-tts]"); if (m){ setTtsMode(m.dataset.tts); if (m.dataset.tts === "browser") speak("Hello. Let's get started."); }
});

function streak(){
  let n = 0; const d = new Date();
  if (!(P.days[today()] > 0)) d.setDate(d.getDate()-1);
  for (;;){ const k = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); if (P.days[k] > 0){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}

/* ---------- today ---------- */
function buildQueue(){
  const items = allItems();
  const weak = shuffle(items.filter(i => P.marks[i.key] && P.marks[i.key].s === "weak"));
  const unseen = shuffle(items.filter(i => !P.marks[i.key]));
  const old = items.filter(i => P.marks[i.key] && P.marks[i.key].s === "ok").sort((a,b) => (P.marks[a.key].t||"").localeCompare(P.marks[b.key].t||""));
  const pick = []; const add = (arr, n) => { for (const x of arr){ if (pick.length >= n) break; if (!pick.includes(x.key)) pick.push(x.key); } };
  add(weak, 5); add(unseen, DAILY - 2); add(old, DAILY); add(unseen, DAILY); add(weak, DAILY);
  return {date:today(), keys:shuffle(pick), idx:0, label:"今日"};
}
function cardFront(it){
  const g = it.group;
  if (g.kind === "pair") return `<div class="q">${esc(it.basic)}<small>${esc(it.zh)}　→ 更道地的說法是？</small></div>`;
  if (g.kind === "qa") return `<div class="q">${esc(it.en)}<small>${esc(it.zh)}　→ 說出 3 種回法</small></div>`;
  if (g.kind === "ww") return `<div class="q">${esc(it.ex[2].replace(/\*(.+?)\*/, "____"))}<small>${esc(it.zh)}　→ when 還是 while？</small></div>`;
  if (g.kind === "verb") return `<div class="q">${esc(it.zh)}<small>提示：____ ${esc(it.rest)}</small></div>`;
  if (g.kind === "prep") return `<div class="q">${esc(it.zh)}<small>提示：____ ${esc(it.rest)}</small></div>`;
  return `<div class="q">${esc(it.zh)}<small>提示：${esc((it.en||"").split(" ").map(w=>w[0]+"…").join(" "))}</small></div>`;
}

  P.queue.keys = P.queue.keys.filter(k => map[k]);
  const q = P.queue, total = q.keys.length;
  if (q.idx >= total){
    el.innerHTML = `<div class="today"><div class="card done"><div class="n">${total}</div><p>這一輪完成了。</p>
      <p class="sub">今天累計 ${P.days[today()]||0} 張，連續 ${streak()} 天。</p>
      <div class="row" style="justify-content:center;margin-top:16px"><button class="btn" id="again">再來 ${DAILY} 張</button><button class="btn ghost" id="toQuiz">去做測驗</button></div></div></div>`;
    $("#again").onclick = () => { P.queue = buildQueue(); P.queue.label = "加練"; Store.saveProgress(); renderToday(); };
    $("#toQuiz").onclick = () => show("quiz");
    return;
  }
  const it = map[q.keys[q.idx]];
  el.innerHTML = `<div class="today"><div class="row" style="justify-content:space-between"><b>${esc(q.label)}練習</b><span class="sub">${q.idx+1} / ${total}</span></div>
    <div class="meter"><div style="width:${(q.idx/total*100).toFixed(1)}%"></div></div>
    <div class="card" id="card"><div class="from">${esc(setName(it.group.set))}　${P.marks[it.key]?(P.marks[it.key].s==="weak"?"・上次還不熟":"・複習"):"・新卡"}</div>
      ${cardFront(it)}<div id="back" hidden>${cardBack(it)}</div>
      <div class="actions" id="act"><button class="btn" id="flip">翻面看答案</button></div></div>
    <p class="sub" style="font-size:.82rem;margin-top:10px">先在心裡（或小聲）說出答案再翻面。「還不熟」的卡片會優先再出現。</p></div>`;
  $("#flip").onclick = () => {
    $("#back").hidden = false;
    $("#act").innerHTML = `<button class="btn weak" id="bw">還不熟</button><button class="btn good" id="bo">記住了</button>`;
    $("#bw").onclick = () => next("weak"); $("#bo").onclick = () => next("ok");
    $("#bo").focus();
  };
  $("#flip").focus({preventScroll:true});
  function next(s){ setMark(it.key, s); P.days[today()] = (P.days[today()]||0)+1; q.idx++; Store.saveProgress(); updateStats(); renderToday(); }
}

/* ---------- quiz ---------- */
let quizScope = "verbs";
let QZ = null;
const QUIZ_SETS = [["verbs","動詞搭配"],["prep","介系詞"],["native","道地說法"],["travel","出差住宿"],["grammar","when / while"],["added","新增單字"],["weak","我還不熟的"]];
function makeQ(it){
  const g = it.group;
  if (g.kind === "verb" && !it.noquiz){
    const bad = new Set([it.head, ...it.alt]);
    const opts = shuffle(VERB_HEADS.filter(h => !bad.has(h))).slice(0,3).concat(it.head);
    return {prompt:`____ ${it.rest}`, hint:it.zh, ans:it.head, opts:shuffle(opts), it};
  }
  if (g.kind === "prep" && !it.noquiz){
    const m = it.ex[2].match(/\*(\S+)/); if (!m || m[1].toLowerCase() !== it.head) return null;
    const sent = it.ex[2].replace(/\*(\S+)/, "*____").replace(/\*(.+?)\*/, "$1");
    return {prompt:sent, hint:it.ex[3], ans:it.head, opts:shuffle(g.heads.slice()), it, cap:/^\*/.test(it.ex[2])};
  }
  if (g.kind === "pair" && it.basic && it.basic !== it.en){
    const nz = (t) => String(t).toLowerCase().replace(/^(i'm|it's|i am)\s*/,"").replace(/[^a-z ]/g,"").trim();
    const pool = allItems().filter(x => x.group.set === g.set && x.key !== it.key && nz(x.en) !== nz(it.en) && x.zh !== it.zh);
    return {prompt:it.basic, hint:it.zh+"　→ 選出更道地的說法", ans:it.en, opts:shuffle(shuffle(pool).slice(0,3).map(x=>x.en).concat(it.en)), it};
  }
  if (g.kind === "ww" && !it.noquiz){
    return {prompt:it.ex[2].replace(/\*(.+?)\*/, "____"), hint:it.zh, ans:it.ans, opts:["when","while"], it};
  }
  if ((g.kind === "custom" || g.kind === "word") && g.items.length >= 2){
    const pool = g.items.filter(x => x.key !== it.key).map(x => x.en);
    return {prompt:it.zh, hint:"選出對應的英文", ans:it.en, opts:shuffle(shuffle(pool).slice(0,3).concat(it.en)), it};
  }
  return null;
}
function renderQuizHome(){
  const el = $("#v-quiz");
  const custom = CUSTOM.length ? [["custom","我的新增"]] : [];
  el.innerHTML = `<div class="today"><h2>選擇測驗</h2><p class="sub">每回 10 題。答錯的題目會自動標成「還不熟」，明天的卡片會優先出現。</p>
    <div class="qsets">${QUIZ_SETS.concat(custom).map(([id,n]) => `<button aria-pressed="${quizScope===id}" data-s="${id}">${n}</button>`).join("")}</div>
    <button class="btn" id="startQ">開始測驗</button><div id="qbox"></div></div>`;
  el.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { quizScope = b.dataset.s; renderQuizHome(); });
  $("#startQ").onclick = startQuiz;
}
function startQuiz(){
  let pool = allItems();
  if (quizScope === "weak") pool = pool.filter(i => P.marks[i.key] && P.marks[i.key].s === "weak");
  else if (quizScope.startsWith("g:")) pool = pool.filter(i => i.group.id === quizScope.slice(2));
  else pool = pool.filter(i => i.group.set === quizScope);
  const qs = shuffle(pool).map(makeQ).filter(Boolean).slice(0,10);
  const box = $("#qbox") || (renderQuizHome(), $("#qbox"));
  if (!qs.length){ box.innerHTML = `<p class="note" style="margin-top:16px">這個範圍目前沒有可出的題目。${quizScope==="weak"?"先去「今日練習」把不熟的卡片標出來。":""}</p>`; return; }
  QZ = {qs, i:0, score:0};
  $("#startQ").textContent = "重新開始";
  renderQ();
}
function renderQ(){
  const box = $("#qbox"); const {qs, i} = QZ;
  if (i >= qs.length){
    box.innerHTML = `<div class="card done" style="margin-top:18px"><div class="n">${QZ.score} / ${qs.length}</div><p>${QZ.score===qs.length?"全對！":"答錯的已加入「還不熟」。"}</p></div>`;
    Store.saveProgress(); updateStats(); return;
  }
  const q = qs[i];
  const disp = (o) => q.cap && q.prompt.startsWith("____") ? cap(o) : o;
  box.innerHTML = `<div class="card" style="margin-top:18px;min-height:0"><div class="from">第 ${i+1} / ${qs.length} 題・${esc(setName(q.it.group.set))}</div>
    <div class="q">${esc(q.prompt)}<small>${esc(q.hint)}</small></div>
    <div class="opts">${q.opts.map(o => `<button data-o="${esc(o)}">${esc(disp(o))}</button>`).join("")}</div><div id="fb"></div></div>`;
  box.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
    const ok = b.dataset.o === q.ans;
    box.querySelectorAll("[data-o]").forEach(x => { x.disabled = true; if (x.dataset.o === q.ans) x.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    if (ok) QZ.score++;
    setMark(q.it.key, ok ? (P.marks[q.it.key]&&P.marks[q.it.key].s==="weak"?"weak":"ok") : "weak");
    if (ok && P.marks[q.it.key].s === "weak" && P.marks[q.it.key].n >= 2) P.marks[q.it.key].s = "ok";
    $("#fb").innerHTML = `<div class="fb"><b class="${ok?"ok":"no"}">${ok?"答對了。":"答案是 "+esc(disp(q.ans))+"。"}</b>${q.it.note?` ${esc(q.it.note)}`:""}${exsHTML(q.it)}</div>
      <div class="row" style="margin-top:14px"><button class="btn" id="nq">${i+1<qs.length?"下一題":"看結果"}</button></div>`;
    $("#nq").onclick = () => { QZ.i++; renderQ(); }; $("#nq").focus();
  });
}

/* ---------- add ---------- */
let SAMPLE = null, SAMPLE_LIMITS = null, pendingImgs = [], preview = null;
async function initSample(){
  try{
    if (!window.claude || !window.claude.use) return;
    SAMPLE = await window.claude.use("sample");
    if (SAMPLE) SAMPLE_LIMITS = await SAMPLE.limits().catch(()=>null);
    if (currentView === "add") renderAdd();
  }catch(e){ SAMPLE = null; }
}
function renderAdd(){
  const el = $("#v-add");
  const canImg = !!(SAMPLE_LIMITS && SAMPLE_LIMITS.images);
  el.innerHTML = `<h2>新增詞彙</h2><p class="sub">貼上你在網路上看到、不熟的單字或片語（一行一個），${canImg?"或上傳截圖，":""}Claude 會分組、做比較表，並產生三個等級的例句。</p>
    ${SAMPLE ? `<textarea id="words" placeholder="例如：&#10;run into&#10;run out of&#10;figure out&#10;come up with"></textarea>
      ${canImg?`<div style="margin-top:10px"><label class="drop" for="imgs">＋ 上傳截圖（最多 ${SAMPLE_LIMITS.images.maxCount} 張）</label><input type="file" id="imgs" accept="${esc(SAMPLE_LIMITS.images.mediaTypes.join(","))}" multiple hidden><div class="thumbs" id="thumbs"></div></div>`:""}
      <div class="row" style="margin-top:12px"><button class="btn" id="gen">產生比較表與例句</button><button class="btn ghost" id="stop" hidden>停止</button></div>
      <div class="status" id="st" aria-live="polite"></div><div id="pv"></div>`
    : `<div class="note">這個畫面目前無法直接呼叫 Claude。請把單字、片語或截圖貼到和 Claude 的對話中，Claude 會整理好並更新到這個 App。</div>`}
    <h3>我新增的群組</h3>
    ${CUSTOM.length ? `<ul class="mylist">${CUSTOM.map(g => `<li><b>${esc(g.title)}</b>　<span class="sub">${esc(g.zh||"")}・${(g.items||[]).length} 個</span>　<button class="linkbtn" data-del="${esc(g.id)}">刪除</button></li>`).join("")}</ul>` : `<p class="sub">還沒有。新增後會出現在「詞庫與比較表 → 我的新增」，也會加入每日卡片。</p>`}`;
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const id = b.dataset.del; const g = CUSTOM.find(x => x.id === id);
    if (!confirm(`刪除「${g ? g.title : id}」？`)) return;
    CUSTOM = CUSTOM.filter(x => x.id !== id); await Store.deleteCustom(id); rebuild(); updateStats(); renderAdd();
  });
  if (!SAMPLE) return;
  if (canImg){
    $("#imgs").onchange = (e) => {
      pendingImgs = Array.from(e.target.files).slice(0, SAMPLE_LIMITS.images.maxCount);
      $("#thumbs").innerHTML = pendingImgs.map(f => `<img alt="" src="${URL.createObjectURL(f)}">`).join("");
    };
  }
  $("#gen").onclick = generate;
  if (preview) showPreview();
}
const PROMPT = (words, hasImg) => `You are an English coach for a Taiwanese server mechanical engineer (English level about A2, wants to reach B1-B2).
Input: words / phrases the learner saw online${hasImg ? " (also extract every English word, phrase or sentence pair from the attached screenshots; ignore app UI text like likes, follow buttons, usernames)" : ""}.
${words ? "Text input:\n" + words : ""}

Task:
1. Extract every target word or phrase. Group related or easily confused ones together (each group 3-15 items; one group is fine if they are all related).
2. For each group, return a comparison-friendly study set.

Return ONLY valid JSON, no markdown, in this exact shape:
{"groups":[{"title":"short English title","zh":"繁體中文副標","core":"一句繁體中文說明這組的核心差別或記憶方法","compare":[["A","B","繁體中文說明差別"]],"items":[{"en":"expression","zh":"繁體中文意思","note":"繁體中文用法提醒（可空字串）","fit":"w","basic":"","ex":[[1,"L","A2+/B1 sentence with the *target* marked.","繁體中文翻譯"],[2,"S","B1 sentence with the *target*.","繁體中文翻譯"],[3,"M","B1+/B2 sentence with the *target*.","繁體中文翻譯"]]}],"ladder":[[1,"L","Sentence with *target*.","繁體中文翻譯"]]}]}

Rules:
- fit: "w" = OK at work and meetings, "c" = casual, "!" = be careful (rude, slang, or regional).
- basic: a simpler textbook equivalent if the item is a native-style phrase, else "".
- Level numbers: 1 = A2+/B1, 2 = B1, 3 = B1+/B2.
- items[].ex: exactly 3 example sentences, one for each level 1, 2, 3.
- ladder: 2 or 3 sentences for EACH level (6-9 total), using several items of the group.
- Context codes: "L" daily life, "S" server mechanical engineering (chassis, bracket, PCBA, cable routing, tolerance stack-up, rack, screw, fan, PSU, EVT/DVT, DFM), "M" meeting / email English. Mix contexts.
- compare: 2-4 rows of the most confusing pairs.
- Use simple, natural English that real engineers say. Mark the target with *asterisks* in every sentence.
- Chinese must be Traditional Chinese (Taiwan).`;
let abortCtl = null;
async function generate(){
  const words = $("#words").value.trim();
  if (!words && !pendingImgs.length){ $("#st").textContent = "請先貼上單字或上傳截圖。"; return; }
  const btn = $("#gen"), stop = $("#stop"), st = $("#st");
  btn.disabled = true; stop.hidden = false; st.textContent = "Claude 正在整理，約需 20–60 秒…";
  abortCtl = new AbortController(); stop.onclick = () => abortCtl.abort();
  try{
    const opts = {signal:abortCtl.signal, modelTier:"default", cache:false, onText:({text}) => { st.textContent = `產生中…（${text.length} 字）`; }};
    if (pendingImgs.length) opts.images = pendingImgs;
    const res = await SAMPLE.json(PROMPT(words, pendingImgs.length > 0), opts);
    const gs = (res && Array.isArray(res.groups)) ? res.groups : [];
    const clean = gs.filter(g => g && Array.isArray(g.items) && g.items.length).map((g, n) => ({
      id:"g_"+Date.now().toString(36)+n, created:Date.now()+n, title:String(g.title||"My words"), zh:String(g.zh||""), core:String(g.core||""),
      compare:(g.compare||[]).filter(r=>Array.isArray(r)&&r.length>=3).map(r=>r.slice(0,3).map(String)),
      items:g.items.filter(x=>x&&x.en).map(x => ({en:String(x.en), zh:String(x.zh||""), note:String(x.note||""), fit:["w","c","!"].includes(x.fit)?x.fit:"", basic:String(x.basic||""),
        ex:(Array.isArray(x.ex) ? (Array.isArray(x.ex[0]) ? x.ex : [x.ex]) : []).filter(r=>Array.isArray(r)&&r.length>=3).map(r=>[Number(r[0])||1, String(r[1]||"L"), String(r[2]), String(r[3]||"")]).concat(Array.isArray(x.ex)&&x.ex.length ? [] : [[1,"L",String(x.en),""]])})),
      ladder:(g.ladder||[]).filter(r=>Array.isArray(r)&&r.length>=3).map(r=>[Number(r[0])||1,String(r[1]||"L"),String(r[2]),String(r[3]||"")])
    }));
    if (!clean.length) throw {message:"回覆的格式不完整"};
    preview = clean; st.textContent = `完成：${clean.length} 組、${clean.reduce((a,g)=>a+g.items.length,0)} 個詞彙。確認後按「加入詞庫」。`;
    showPreview();
  }catch(e){
    const c = e && e.code;
    st.textContent = c === "cancelled" ? "已停止。" : c === "not_granted" ? "沒有授權呼叫 Claude。你也可以把單字貼到對話中請 Claude 更新。" : c === "rate_limited" ? "呼叫太頻繁，請稍後再試。" : "產生失敗：" + (e && e.message ? e.message : "請再試一次") ;
  }finally{ btn.disabled = false; stop.hidden = true; }
}
function showPreview(){
  const pv = $("#pv"); if (!pv || !preview) return;
  pv.innerHTML = `<div class="row" style="margin:6px 0 14px"><button class="btn" id="saveG">加入詞庫</button><button class="btn ghost" id="dropG">捨棄</button></div>`+
    preview.map(g => groupHTML(normCustom(g))).join('<div style="height:14px"></div>');
  pv.querySelectorAll("#quizThis,#cardThis").forEach(b => b.remove());
  pv.querySelectorAll("tr[data-ex]").forEach(r => r.onclick = () => { const n = r.nextElementSibling; n.hidden = !n.hidden; });
  $("#dropG").onclick = () => { preview = null; pv.innerHTML = ""; $("#st").textContent = ""; };
  $("#saveG").onclick = async () => {
    for (const g of preview){ CUSTOM.push(g); await Store.saveCustom(g); }
    const first = preview[0].id; preview = null; pendingImgs = [];
    rebuild(); updateStats(); libSel = {type:"group", id:first}; show("lib");
  };
}

/* ---------- boot ---------- */
rebuild(); updateStats(); show("today"); setTtsMode(TTS_MODE);
Store.init(); initSample();
})();
